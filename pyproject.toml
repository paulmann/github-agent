[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The PyPI distribution is github-agent-cli: the names github-agent and ghagent are already
# taken by unrelated projects. The product and the console script keep their names.
name = "github-agent-cli"
description = "Repository and wiki steward: one command per documentation job, standard library only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "github-agent contributors" }]
keywords = [
  "agent",
  "changelog",
  "documentation",
  "github",
  "lint",
  "markdown",
  "repository-audit",
  "wiki",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Pillow is the only optional dependency: it adds PNG output to `ghagent assets render`.
# Every check runs on the standard library.
png = ["Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/paulmann/github-agent"
Documentation = "https://github.com/paulmann/github-agent/tree/main/docs"
Repository = "https://github.com/paulmann/github-agent"
Changelog = "https://github.com/paulmann/github-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/paulmann/github-agent/issues"

[project.scripts]
ghagent = "ghagent:main"

# The version is read from the pack's single source: tools/ghalib/util.py.
# Nothing in this file repeats the number.
[tool.hatch.version]
path = "tools/ghalib/util.py"
pattern = '^PACK_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.py[cod]",
  "/.ghagent",
  "/.install.json",
  "/build",
  "/dist",
]

# The installed package is the CLI plus its library, flat in site-packages:
#   ghagent.py
#   ghalib/...
# `sources` strips the `tools/` prefix, so no generic `tools` package is installed.
[tool.hatch.build.targets.wheel]
only-include = ["tools/ghagent.py", "tools/ghalib"]
sources = ["tools"]

# The source distribution is the complete pack. `ghagent install` copies tools, tests,
# skills, reference, docs, wiki and .github, so the sdist must carry all of them to stay
# installable from an unpacked archive.
[tool.hatch.build.targets.sdist]
only-include = [
  "pyproject.toml",
  "LICENSE",
  "CITATION.cff",
  "README.md",
  "README.ru.md",
  "README.de.md",
  "README.es.md",
  "README.hi.md",
  "README.zh.md",
  "AGENTS.md",
  "AGENTS.ru.md",
  "CHANGELOG.md",
  "CHANGELOG.ru.md",
  "CONTRIBUTING.md",
  "CONTRIBUTING.ru.md",
  "SECURITY.md",
  "SECURITY.ru.md",
  "SUPPORT.md",
  "SUPPORT.ru.md",
  "CODE_OF_CONDUCT.md",
  "CODE_OF_CONDUCT.ru.md",
  "GOVERNANCE.md",
  "GOVERNANCE.ru.md",
  ".editorconfig",
  ".ghagent.json",
  ".gitattributes",
  ".gitignore",
  ".dockerignore",
  ".pre-commit-hooks.yaml",
  "action.yml",
  "Dockerfile",
  "scripts",
  "assets",
  "docs",
  "examples",
  "reference",
  "skills",
  "tests",
  "tools",
  "wiki",
  ".github",
]
