name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Self-tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Run the pack self-tests
        run: python tests/run_tests.py

      - name: The CLI answers
        run: python tools/ghagent.py --version

  documents:
    name: Documents and repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Markdown, links, anchors, privacy
        run: python tools/ghagent.py doc --root .

      - name: Repository hygiene and file contracts
        run: python tools/ghagent.py audit . --min-score 80

      - name: Changelog conformance
        run: python tools/ghagent.py changelog check --repo paulmann/github-agent

      - name: Banner and social preview
        run: python tools/ghagent.py assets check

      - name: Wiki builds and verifies
        run: |
          python tools/ghagent.py wiki build
          python tools/ghagent.py wiki verify

      - name: No BOM, no CRLF, no machine paths
        run: python tools/ghagent.py privacy --root .

  package:
    name: Package (sdist, wheel, clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Version, wheel layout and sdist completeness
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("tools/ghalib/util.py").read_text(encoding="utf-8")
          print(re.search(r'^PACK_VERSION = "([^"]+)"', text, re.M).group(1))
          PY
          )
          echo "expected version: $EXPECTED_VERSION"
          test -f "dist/github_agent_cli-${EXPECTED_VERSION}-py3-none-any.whl"
          test -f "dist/github_agent_cli-${EXPECTED_VERSION}.tar.gz"

          python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          grep -q '^ghagent.py' wheel-contents.txt
          grep -q '^ghalib/' wheel-contents.txt
          if grep -q '^tools/' wheel-contents.txt; then
            echo "::error::the wheel installs a top-level tools package"
            exit 1
          fi

          python -m tarfile -l dist/*.tar.gz | tee sdist-contents.txt
          for path in action.yml Dockerfile pyproject.toml tools/ghagent.py tests/run_tests.py \
                      skills reference docs wiki assets; do
            grep -q "/$path" sdist-contents.txt || {
              echo "::error::the sdist is missing $path"
              exit 1
            }
          done

      - name: No third-party runtime dependency
        run: |
          set -euo pipefail
          python - <<'PY'
          import email
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(name))
          requires = metadata.get_all("Requires-Dist") or []
          print("Requires-Dist:", requires or "none")
          unexpected = [item for item in requires if "extra ==" not in item]
          if unexpected:
              raise SystemExit(f"runtime dependencies found: {unexpected}")
          PY

      - name: Install the wheel in a clean virtual environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pkg-venv"
          "$RUNNER_TEMP/pkg-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/pkg-venv/bin/python" -m pip list
          EXPECTED_VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("tools/ghalib/util.py").read_text(encoding="utf-8")
          print(re.search(r'^PACK_VERSION = "([^"]+)"', text, re.M).group(1))
          PY
          )
          test "$("$RUNNER_TEMP/pkg-venv/bin/ghagent" --version)" = "github-agent $EXPECTED_VERSION"

      - name: Smoke-test the installed CLI on this checkout
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/pkg-venv"
          "$VENV/bin/ghagent" doc --root .
          "$VENV/bin/ghagent" audit . --min-score 80

  container:
    name: Container image (build and run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image from the Dockerfile
        run: docker build --tag ghagent:ci .

      - name: The entry point answers
        run: docker run --rm ghagent:ci --version

      - name: The image audits this checkout
        run: docker run --rm --volume "$PWD:/repo" ghagent:ci audit . --min-score 80

      - name: The image lints the documents
        run: docker run --rm --volume "$PWD:/repo" ghagent:ci doc --root .
  manifests:
    name: Package-manager manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Homebrew formula syntax
        run: ruby -c packaging/homebrew/github-agent-cli.rb

      - name: Homebrew formula downloads and verifies
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request

          text = pathlib.Path("packaging/homebrew/github-agent-cli.rb").read_text(encoding="utf-8")
          url = re.search(r'^\s*url "([^"]+)"', text, re.M).group(1)
          expected = re.search(r'^\s*sha256 "([0-9a-f]{64})"', text, re.M).group(1)
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          actual = hashlib.sha256(data).hexdigest()
          print(f"downloaded {url} ({len(data)} bytes), sha256 {actual}")
          if actual != expected:
              raise SystemExit("formula sha256 does not match the downloaded sdist")
          version = re.search(r"github_agent_cli-([0-9.]+)\.tar\.gz", url).group(1)
          pypi = json.load(urllib.request.urlopen("https://pypi.org/pypi/github-agent-cli/json", timeout=60))
          if pypi["info"]["version"] != version:
              raise SystemExit(f"formula pins {version}, PyPI serves {pypi['info']['version']}")
          print(f"formula pins the current PyPI version {version}")
          PY

      - name: Scoop manifest downloads and verifies
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import urllib.request
          import zipfile

          manifest = json.loads(pathlib.Path("packaging/scoop/github-agent-cli.json").read_text(encoding="utf-8"))
          with urllib.request.urlopen(manifest["url"], timeout=60) as response:
              data = response.read()
          actual = hashlib.sha256(data).hexdigest()
          print(f"downloaded {manifest['url']} ({len(data)} bytes), sha256 {actual}")
          if actual != manifest["hash"]:
              raise SystemExit("scoop hash does not match the downloaded bundle")
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              names = archive.namelist()
          required = f"{manifest['extract_dir']}/{manifest['bin']}"
          if required not in names:
              raise SystemExit(f"the bundle has no {required}")
          if not any(name.startswith(f"{manifest['extract_dir']}/lib/ghagent.py") for name in names):
              raise SystemExit("the bundle has no lib/ghagent.py")
          print(f"bundle layout is valid, {len(names)} entries")
          PY
