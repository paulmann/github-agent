name: Publish

# Publication is event-driven: publishing a GitHub release uploads that tag to PyPI. The manual
# `workflow_dispatch` path stays as the escape hatch for a re-run, and needs the confirmation word.
#
# Authentication, in order of preference:
#   1. Trusted Publishing (OIDC): add a trusted publisher for this project on PyPI, then delete
#      the `password:` line below and the PYPI_API_TOKEN secret. Nothing long-lived is stored.
#   2. API token: the PYPI_API_TOKEN repository secret (used here until the trusted publisher is
#      configured). Rotate or revoke it after switching to OIDC.
#
# `skip-existing: true` makes a re-run of an already uploaded version a no-op instead of a red job.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to upload the built distributions to PyPI.
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/github-agent-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        # Pinned release, not a moving tag: the uploader holds the credential.
        # `skip-existing` makes a retry after a partial network failure idempotent.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true
