name: Repository audit request
description: Ask for an audit of a public repository against these contracts
labels: ["audit"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/name, public, with a README and CHANGELOG
      placeholder: owner/name
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: What to look at first
      description: For example README structure, wiki navigation, changelog dates
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: The repository is public and its audit may be discussed in this issue
          required: true