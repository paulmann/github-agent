name: Bug report
description: A command does not do what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run the command with --json and paste its output: it names the rule
        and the file without exposing file contents.
  - type: input
    id: version
    attributes:
      label: Pack version
      description: Output of python tools/ghagent.py --version
      placeholder: github-agent 1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: Python 3.13.15 on Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and its output
      description: The exact command, the exit code, and the output (use --json if possible)
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: The output contains no tokens, passwords or personal data
          required: true